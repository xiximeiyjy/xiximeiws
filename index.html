<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>网站首页示例</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 页面样式（纯 HTML + CSS） -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        /* 头部导航 */
        header {
            background: #1f2937;
            color: #fff;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 22px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* 首屏区域 */
        .hero {
            background: linear-gradient(120deg, #2563eb, #1e40af);
            color: #fff;
            padding: 80px 20px;
            text-align: center;
        }

        .hero h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            max-width: 700px;
            margin: 0 auto 30px;
        }

        .hero button {
            background: #fff;
            color: #2563eb;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .hero button:hover {
            background: #e5e7eb;
        }

        /* 内容区域 */
        .container {
            max-width: 1100px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title h3 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .section-title p {
            color: #666;
        }

        /* 功能卡片 */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h4 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .card p {
            color: #555;
            font-size: 15px;
        }

        /* 页脚 */
        footer {
            background: #1f2937;
            color: #ccc;
            text-align: center;
            padding: 25px 15px;
            margin-top: 60px;
            font-size: 14px;
        }

        footer span {
            color: #fff;
        }
    </style>
</head>

<body>

    <!-- 头部 -->
    <header>
        <h1>我的网站</h1>
        <nav>
            <a href="#">首页</a>
            <a href="#">产品</a>
            <a href="#">服务</a>
            <a href="#">关于我们</a>
            <a href="#">联系我们</a>
        </nav>
    </header>

    <!-- 首屏展示 -->
    <section class="hero">
        <h2>专注 · 高效 · 专业</h2>
        <p>
            这是一个纯 HTML 实现的现代化网站首页示例，
            界面简洁美观，适用于企业官网、产品展示或个人项目。
        </p>
        <button>立即了解</button>
    </section>

    <!-- 功能介绍 -->
    <section class="container">
        <div class="section-title">
            <h3>我们的优势</h3>
            <p>为您提供稳定、高效、可靠的解决方案</p>
        </div>

        <div class="features">
            <div class="card">
                <h4>简洁设计</h4>
                <p>
                    界面设计简洁大方，结构清晰，
                    提升用户体验与访问效率。
                </p>
            </div>

            <div class="card">
                <h4>纯 HTML 实现</h4>
                <p>
                    无需任何框架或第三方库，
                    代码轻量，易于维护与二次开发。
                </p>
            </div>

            <div class="card">
                <h4>响应式布局</h4>
                <p>
                    自动适配电脑、平板与手机，
                    在不同设备上均有良好展示效果。
                </p>
            </div>

            <div class="card">
                <h4>实用扩展</h4>
                <p>
                    可轻松扩展为企业官网、后台系统、
                    产品宣传页等多种场景。
                </p>
            </div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        © 2025 <span>我的网站</span> | 版权所有 | 技术支持
    </footer>

</body>
</html>
